[package]
name = "fstsed"
version = "0.5.0"
authors = ["Eric Hutchins"]
description = "Find and replace/decorate text at scale using finite state transducers (fst)"
homepage = "https://github.com/erichutchins/fstsed"
repository = "https://github.com/erichutchins/fstsed"
readme = "README.md"
categories = ["text-processing", "command-line-interface"]
keywords = ["cli", "fst", "sed", "dfir"]
license = "Unlicense OR MIT"
edition = "2021"

[[bin]]
name = "fstsed"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = false
debug-assertions = false
panic = "abort"
incremental = false

[dependencies]
anyhow = "1.0"
bstr = "1.12"
camino = "1.1.6"
clap = { version = "4.5.4", features = ["derive", "cargo", "wrap_help"] }
fst = "0.4.7"

ignore = "0.4.25"
itermore = { version = "0.7.1", default-features = false, features = [
    "array_chunks",
    "array_windows",
] }
memchr = "2.7.6"
memmap2 = "0.9.9"
microtemplate = "1.0.3"
serde_json = "1.0.149"
termcolor = "1.4.1"
thiserror = "1.0"
zstd = "0.13.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
fake = { version = "4", features = ["derive"] }
proptest = "1.4"
rand = "0.8"
tempfile = "3"

[[bench]]
name = "search_bench"
harness = false
